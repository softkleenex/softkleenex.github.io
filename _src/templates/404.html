{% extends "base.html" %}
{% block layout %}
<div class="shell">
  <main id="content">
    <section class="hero">
      <p class="eyebrow">404</p>
      <h1 id="nf-title">페이지를 찾을 수 없습니다</h1>
      <p class="lead" id="nf-lead">
        주소가 바뀌었거나 삭제된 페이지입니다.
        2026년 8월에 사이트 구조를 개편하면서 글 주소가 모두 <code>/posts/</code> 아래로 옮겨졌습니다.
      </p>
      <p class="meta"><a href="/posts/">글 목록으로 가기</a> · <a href="/">홈</a></p>
    </section>

    <p class="year">최근 글</p>
    {%- for p in recent %}
    <a class="entry" href="/posts/{{ p.slug }}/">
      <p class="kicker">{{ p.category }}</p>
      <h2>{{ p.title }}</h2>
      <p class="desc">{{ p.description }}</p>
      <time datetime="{{ p.date }}">{{ p.date_ko }}</time>
    </a>
    {%- endfor %}
  </main>
</div>
<script>
// 개편 전 주소를 새 주소로 보낸다. GitHub Pages 는 서버 리다이렉트를 만들 수 없어
// 404 페이지에서 경로를 해석한다.
(function () {
  var SLUGS = {{ slugs|safe }};
  var path = location.pathname.replace(/\/+$/, "");
  var last = path.split("/").pop();
  var dest = null;

  // 이미지·CSS 같은 자산 요청은 그대로 404 로 둔다.
  // 깨진 <img> 를 글 목록으로 보내봐야 의미가 없다.
  if (/\.(png|jpe?g|gif|svg|webp|ico|css|js|json|xml|txt|pdf|woff2?|map)$/i.test(path)) {
    return;
  }

  if (SLUGS.indexOf(last) !== -1) {
    dest = "/posts/" + last + "/";
  } else if (/^\/(coding_training|blog)(\/|$)/.test(path)) {
    dest = "/posts/";
  }

  if (dest && dest !== location.pathname) {
    var t = document.getElementById("nf-title");
    var l = document.getElementById("nf-lead");
    if (t) t.textContent = "주소가 바뀌었습니다";
    if (l) l.innerHTML = '새 주소로 이동합니다. 자동으로 넘어가지 않으면 <a href="' + dest + '">여기</a>를 눌러주세요.';
    location.replace(dest);
  }
})();
</script>
{% endblock %}
